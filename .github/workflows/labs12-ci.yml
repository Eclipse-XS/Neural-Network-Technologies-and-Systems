name: Labs 1 & 2 CPU CI

on:
  pull_request:
    paths:
      - 'labs/lab01_transformer/**'
      - 'labs/lab02_llm_api/**'
      - '.github/workflows/labs12-ci.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'labs/lab01_transformer/**'
      - 'labs/lab02_llm_api/**'
      - '.github/workflows/labs12-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install CPU-only dependencies for Labs 1 & 2
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest nbformat pandas numpy matplotlib scikit-learn nltk openai

      - name: Compile Lab 1 & Lab 2 Python modules
        run: |
          python -m compileall -q labs/lab01_transformer/src labs/lab01_transformer/scripts labs/lab02_llm_api/src

      - name: Run Lab 1 & Lab 2 unit tests
        run: |
          python -m pytest labs/lab01_transformer/tests labs/lab02_llm_api/tests -q

      - name: Validate Lab 1 notebook schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for path in sorted(Path('labs/lab01_transformer/notebooks').glob('*.ipynb')):
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              print(f'validated: {path}')
          PY
