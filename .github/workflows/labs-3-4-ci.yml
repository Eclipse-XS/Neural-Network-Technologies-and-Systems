name: Labs 3 and 4 offline quality checks

on:
  push:
    paths:
      - "labs/lab03_rag/**"
      - "labs/lab04_stable_diffusion/**"
      - "scripts/build_labs34_portfolio.py"
      - "scripts/execute_portfolio_notebooks.py"
      - "scripts/rebuild_executable_notebooks.py"
      - "docs/audits/notebook-execution-comparison.md"
      - "docs/audits/labs-3-4-qa.md"
      - "README.md"
      - ".github/workflows/labs-3-4-ci.yml"
  pull_request:
    paths:
      - "labs/lab03_rag/**"
      - "labs/lab04_stable_diffusion/**"
      - "scripts/build_labs34_portfolio.py"
      - "scripts/execute_portfolio_notebooks.py"
      - "scripts/rebuild_executable_notebooks.py"
      - "docs/audits/notebook-execution-comparison.md"
      - "docs/audits/labs-3-4-qa.md"
      - "README.md"
      - ".github/workflows/labs-3-4-ci.yml"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only test dependencies
        run: >-
          python -m pip install
          pytest nbformat nbclient jupyter-client ipykernel pandas numpy matplotlib Pillow
          langchain-core langchain-community langchain-openai
          langchain-huggingface langchain-redis redis redisvl
      - name: Compile source modules
        run: python -m compileall -q labs/lab03_rag/src labs/lab04_stable_diffusion/src
      - name: Execute portfolio replay with a real kernel
        env:
          PORTFOLIO_MODE: replay
        run: python scripts/execute_portfolio_notebooks.py --mode replay
      - name: Run offline unit and notebook checks
        run: |
          python -m pytest labs/lab03_rag/tests -q
          python -m pytest labs/lab04_stable_diffusion/tests -q
