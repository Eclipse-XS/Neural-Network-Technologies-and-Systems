services:
  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: lab07-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - lab07-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lab07-data:
